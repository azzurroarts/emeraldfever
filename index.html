
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emerald Fever — Enter</title>
  <style>
    :root {
      --bg-1: #020706;
      --bg-2: #041110;
      --bg-3: #0a1d1c;
      --neon-a: #4dffda;
      --neon-b: #00ff88;
      --neon-c: #60d7ff;
      --text: #d9fff4;
      --glow: 0 0 12px rgba(77,255,218,.65), 0 0 28px rgba(0,255,136,.45), 0 0 64px rgba(96,215,255,.2);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(0,255,136,0.08), transparent 18%),
        radial-gradient(circle at 50% 55%, rgba(96,215,255,0.08), transparent 26%),
        linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 38%, var(--bg-1) 100%);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(circle at center, rgba(0,255,136,.12), transparent 20%),
        conic-gradient(from 0deg,
          transparent 0deg 8deg,
          rgba(96,215,255,.08) 8deg 11deg,
          transparent 11deg 24deg,
          rgba(0,255,136,.06) 24deg 28deg,
          transparent 28deg 360deg);
      filter: blur(40px) saturate(120%);
      animation: slowSpin 28s linear infinite;
      transform-origin: center;
      pointer-events: none;
      opacity: 0.8;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 0 42%, rgba(0,0,0,.38) 80%, rgba(0,0,0,.72) 100%),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.02) 0px,
          rgba(255,255,255,0.02) 1px,
          transparent 2px,
          transparent 4px
        );
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .rays, .rays::before, .rays::after {
      position: absolute;
      content: "";
      width: 68vmin;
      height: 68vmin;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .rays {
      background: conic-gradient(
        from 0deg,
        rgba(0,255,136,.0) 0deg,
        rgba(0,255,136,.18) 10deg,
        rgba(96,215,255,.03) 16deg,
        rgba(0,255,136,.0) 24deg,
        rgba(96,215,255,.14) 32deg,
        rgba(0,255,136,.0) 44deg,
        rgba(0,255,136,.16) 56deg,
        rgba(0,255,136,.0) 70deg,
        rgba(96,215,255,.10) 84deg,
        rgba(0,255,136,.0) 100deg,
        rgba(0,255,136,.16) 120deg,
        rgba(0,255,136,.0) 132deg,
        rgba(96,215,255,.16) 156deg,
        rgba(0,255,136,.0) 170deg,
        rgba(0,255,136,.16) 194deg,
        rgba(0,255,136,.0) 208deg,
        rgba(96,215,255,.14) 234deg,
        rgba(0,255,136,.0) 250deg,
        rgba(0,255,136,.16) 278deg,
        rgba(0,255,136,.0) 292deg,
        rgba(96,215,255,.12) 318deg,
        rgba(0,255,136,.0) 338deg,
        rgba(0,255,136,.18) 360deg
      );
      filter: blur(18px);
      opacity: .95;
      animation: slowSpin 18s linear infinite;
      mask: radial-gradient(circle at center, rgba(0,0,0,0) 0 12%, rgba(0,0,0,1) 28%, rgba(0,0,0,0) 66%);
    }

    .rays::before {
      background: conic-gradient(
        from 30deg,
        transparent 0deg 14deg,
        rgba(255,255,255,.18) 14deg 16deg,
        transparent 16deg 48deg,
        rgba(77,255,218,.20) 48deg 52deg,
        transparent 52deg 92deg,
        rgba(96,215,255,.16) 92deg 96deg,
        transparent 96deg 360deg
      );
      filter: blur(28px);
      opacity: .8;
      animation: slowSpinReverse 26s linear infinite;
      mask: radial-gradient(circle at center, transparent 0 20%, black 32%, transparent 70%);
    }

    .rays::after {
      background: radial-gradient(circle, rgba(255,255,255,.55) 0 2%, rgba(96,215,255,.22) 8%, rgba(0,255,136,.08) 22%, transparent 42%);
      filter: blur(18px);
      opacity: .95;
      animation: pulse 3.6s ease-in-out infinite;
    }

    .sigil-wrap {
      position: relative;
      width: min(42vmin, 420px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .sigil-aura,
    .sigil-aura::before,
    .sigil-aura::after {
      position: absolute;
      inset: -10%;
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .sigil-aura {
      background: radial-gradient(circle, rgba(0,255,136,.24) 0 18%, rgba(96,215,255,.16) 28%, rgba(0,255,136,.06) 45%, transparent 68%);
      filter: blur(20px);
      animation: pulse 2.6s ease-in-out infinite;
    }

    .sigil-aura::before {
      inset: 8%;
      background: radial-gradient(circle, rgba(255,255,255,.35), rgba(77,255,218,.08) 30%, transparent 58%);
      filter: blur(14px);
      animation: flicker 2.1s infinite;
    }

    .sigil-aura::after {
      inset: -6%;
      background: conic-gradient(from 90deg, transparent, rgba(0,255,136,.18), transparent, rgba(96,215,255,.16), transparent);
      filter: blur(32px);
      animation: slowSpin 20s linear infinite;
      opacity: .8;
    }

    .sigil {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 3;
      filter:
        drop-shadow(0 0 3px rgba(255,255,255,.7))
        drop-shadow(0 0 10px rgba(77,255,218,.85))
        drop-shadow(0 0 22px rgba(0,255,136,.65))
        drop-shadow(0 0 52px rgba(96,215,255,.45));
      animation: breathe 3.8s ease-in-out infinite, flicker 4.4s infinite;
      opacity: .98;
      user-select: none;
      -webkit-user-drag: none;
    }

    .sigil-core {
      position: absolute;
      width: 22%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.92), rgba(96,215,255,.55) 28%, rgba(0,255,136,.18) 55%, transparent 72%);
      filter: blur(12px);
      animation: pulse 2s ease-in-out infinite;
      z-index: 2;
    }

    .enter {
      position: absolute;
      bottom: 8vh;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 15px 26px 14px;
      color: var(--text);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .42em;
      font-size: clamp(14px, 1.35vw, 18px);
      border: 1px solid rgba(140,255,228,.25);
      background: linear-gradient(180deg, rgba(10,27,25,.46), rgba(2,8,7,.72));
      box-shadow:
        inset 0 0 18px rgba(96,215,255,.08),
        0 0 18px rgba(0,255,136,.14),
        0 0 42px rgba(96,215,255,.08);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      z-index: 5;
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease, background .25s ease;
      text-shadow: 0 0 10px rgba(77,255,218,.55), 0 0 24px rgba(96,215,255,.25);
      overflow: hidden;
    }

    .enter::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(120deg, transparent 25%, rgba(255,255,255,.18) 50%, transparent 75%);
      transform: translateX(-150%);
      animation: sweep 3.8s ease-in-out infinite;
      pointer-events: none;
      opacity: .75;
    }

    .enter:hover,
    .enter:focus-visible {
      transform: translateX(-50%) translateY(-2px) scale(1.02);
      border-color: rgba(140,255,228,.52);
      box-shadow:
        inset 0 0 24px rgba(96,215,255,.12),
        0 0 24px rgba(0,255,136,.22),
        0 0 56px rgba(96,215,255,.18);
      outline: none;
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      opacity: 0;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      filter: drop-shadow(0 0 8px rgba(255,255,255,.5)) drop-shadow(0 0 14px rgba(77,255,218,.35));
    }

    .sparkle::before,
    .sparkle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(77,255,218,.55), transparent);
      border-radius: 999px;
    }

    .sparkle::before {
      width: 2px;
      height: 100%;
    }

    .sparkle::after {
      width: 100%;
      height: 2px;
    }

    .dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .dust i {
      position: absolute;
      display: block;
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.85), rgba(77,255,218,.45) 45%, transparent 72%);
      left: var(--x);
      top: var(--y);
      opacity: .15;
      filter: blur(.4px);
      animation: drift var(--t) linear infinite;
      animation-delay: var(--d);
    }

    .caption {
      position: absolute;
      bottom: 3.2vh;
      width: 100%;
      text-align: center;
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(210,255,240,.38);
      z-index: 5;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.98); opacity: .78; }
      50% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.985); }
      50% { transform: scale(1.02); }
    }

    @keyframes flicker {
      0%, 100% { opacity: .98; }
      7% { opacity: .92; }
      8% { opacity: 1; }
      9% { opacity: .88; }
      10% { opacity: 1; }
      35% { opacity: .96; }
      36% { opacity: .86; }
      37% { opacity: 1; }
      62% { opacity: .97; }
      63% { opacity: .9; }
      64% { opacity: 1; }
    }

    @keyframes slowSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes slowSpinReverse {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
      35% { opacity: .15; }
      50% { opacity: 1; transform: scale(1) rotate(45deg); }
      65% { opacity: .18; }
    }

    @keyframes drift {
      0% { transform: translate3d(0, 0, 0) scale(.8); opacity: 0; }
      10% { opacity: .18; }
      50% { opacity: .26; }
      100% { transform: translate3d(var(--dx), var(--dy), 0) scale(1.22); opacity: 0; }
    }

    @keyframes sweep {
      0% { transform: translateX(-150%); }
      55%, 100% { transform: translateX(150%); }
    }

    @media (max-width: 700px) {
      .sigil-wrap { width: min(62vmin, 360px); }
      .enter {
        min-width: 150px;
        padding: 14px 22px;
        letter-spacing: .34em;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="dust" aria-hidden="true"></div>
    <div class="rays" aria-hidden="true"></div>

    <section class="sigil-wrap" aria-label="Glowing sigil entry point">
      <div class="sigil-aura"></div>
      <div class="sigil-core"></div>
      <!-- Replace sigil.png with your transparent PNG file path -->
      <img class="sigil" src="sigil.png" alt="Demonic sigil" />
    </section>

    <div class="sparkles" aria-hidden="true"></div>

    <a class="enter" href="story.html">ENTER</a>
    <div class="caption">story mode</div>
  </main>

  <script>
    const sparkles = document.querySelector('.sparkles');
    const dust = document.querySelector('.dust');

    const sparkleCount = 32;
    const dustCount = 38;

    for (let i = 0; i < sparkleCount; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      const size = (Math.random() * 10 + 8).toFixed(2) + 'px';
      const x = (Math.random() * 100).toFixed(2) + '%';
      const y = (Math.random() * 100).toFixed(2) + '%';
      const dur = (Math.random() * 3 + 2.5).toFixed(2) + 's';
      const delay = (Math.random() * 4).toFixed(2) + 's';
      s.style.setProperty('--size', size);
      s.style.setProperty('--x', x);
      s.style.setProperty('--y', y);
      s.style.setProperty('--dur', dur);
      s.style.setProperty('--delay', delay);
      sparkles.appendChild(s);
    }

    for (let i = 0; i < dustCount; i++) {
      const p = document.createElement('i');
      const s = (Math.random() * 4 + 1).toFixed(2) + 'px';
      const x = (Math.random() * 100).toFixed(2) + '%';
      const y = (Math.random() * 100).toFixed(2) + '%';
      const t = (Math.random() * 14 + 10).toFixed(2) + 's';
      const d = (-Math.random() * 14).toFixed(2) + 's';
      const dx = (Math.random() * 80 - 40).toFixed(2) + 'px';
      const dy = (Math.random() * 120 - 60).toFixed(2) + 'px';
      p.style.setProperty('--s', s);
      p.style.setProperty('--x', x);
      p.style.setProperty('--y', y);
      p.style.setProperty('--t', t);
      p.style.setProperty('--d', d);
      p.style.setProperty('--dx', dx);
      p.style.setProperty('--dy', dy);
      dust.appendChild(p);
    }
  </script>
</body>
</html>
