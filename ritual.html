<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emerald Fever — Ritual</title>
  <style>
    :root {
      --bg-1: #010404;
      --bg-2: #04100f;
      --bg-3: #0a1d1c;
      --neon-a: #4dffda;
      --neon-b: #00ff88;
      --neon-c: #60d7ff;
      --text: #dbfff7;
      --muted: rgba(219, 255, 247, 0.7);
      --panel: rgba(3, 12, 11, 0.54);
      --border: rgba(140, 255, 228, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(96,215,255,0.08), transparent 20%),
        radial-gradient(circle at 50% 58%, rgba(0,255,136,0.07), transparent 28%),
        linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 42%, var(--bg-1) 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -18%;
      background:
        conic-gradient(
          from 0deg,
          transparent 0deg 14deg,
          rgba(96,215,255,0.035) 14deg 18deg,
          transparent 18deg 36deg,
          rgba(0,255,136,0.03) 36deg 42deg,
          transparent 42deg 360deg
        );
      filter: blur(46px);
      animation: slowSpin 34s linear infinite;
      opacity: 0.72;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 0 46%, rgba(0,0,0,0.36) 82%, rgba(0,0,0,0.76) 100%),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.017) 0px,
          rgba(255,255,255,0.017) 1px,
          transparent 2px,
          transparent 4px
        );
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 104px 24px 120px;
      isolation: isolate;
    }

    .nav-link {
      position: fixed;
      top: 24px;
      z-index: 12;
      color: rgba(219,255,247,0.76);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(140,255,228,0.2);
      background: rgba(2, 8, 7, 0.42);
      backdrop-filter: blur(8px);
      transition: 0.25s ease;
      box-shadow: 0 0 20px rgba(96,215,255,0.04);
    }

    .nav-link:hover {
      color: #fff;
      border-color: rgba(140,255,228,0.44);
      box-shadow: 0 0 28px rgba(96,215,255,0.1);
      transform: translateY(-1px);
    }

    .back-link { left: 24px; }
    .next-link { right: 24px; }

    .hero {
      position: relative;
      width: min(1100px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr 0.95fr;
      gap: 30px;
      align-items: start;
      z-index: 5;
    }

    .panel {
      position: relative;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(7,19,18,0.4), rgba(2,8,7,0.68));
      backdrop-filter: blur(8px);
      box-shadow:
        inset 0 0 26px rgba(96,215,255,0.035),
        0 0 30px rgba(0,255,136,0.06),
        0 0 82px rgba(96,215,255,0.05);
      border-radius: 26px;
      overflow: hidden;
    }

    .ritual-image-panel {
      min-height: 520px;
      display: grid;
      place-items: center;
      padding: 28px;
      isolation: isolate;
      position: sticky;
      top: 88px;
      align-self: start;
    }

    .ritual-image-panel::before {
      content: "";
      position: absolute;
      inset: 8% 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,136,0.16) 0 14%, rgba(96,215,255,0.11) 26%, rgba(0,255,136,0.04) 46%, transparent 70%);
      filter: blur(24px);
      animation: breathe 5.4s ease-in-out infinite;
      pointer-events: none;
    }

    .ritual-image-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 18%),
        linear-gradient(0deg, rgba(0,255,136,0.05), transparent 26%);
      pointer-events: none;
    }

    .ritual-art-wrap {
      position: relative;
      width: min(100%, 620px);
      z-index: 3;
    }

    .ritual-aura,
    .ritual-aura::before,
    .ritual-aura::after {
      content: "";
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      pointer-events: none;
    }

    .ritual-aura {
      background: radial-gradient(circle, rgba(255,255,255,0.08), rgba(96,215,255,0.08) 28%, rgba(0,255,136,0.06) 48%, transparent 68%);
      filter: blur(20px);
      animation: pulse 4s ease-in-out infinite;
    }

    .ritual-aura::before {
      inset: -2%;
      background: conic-gradient(from 0deg, transparent, rgba(0,255,136,0.12), transparent, rgba(96,215,255,0.12), transparent);
      filter: blur(30px);
      animation: slowSpin 22s linear infinite;
      opacity: 0.85;
    }

    .ritual-aura::after {
      inset: 12%;
      background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 48%);
      filter: blur(14px);
      animation: flicker 4.2s infinite;
    }

    .ritual-art {
      position: relative;
      width: 100%;
      display: block;
      object-fit: contain;
      z-index: 4;
      filter:
        drop-shadow(0 0 3px rgba(255,255,255,0.65))
        drop-shadow(0 0 10px rgba(77,255,218,0.65))
        drop-shadow(0 0 22px rgba(0,255,136,0.45))
        drop-shadow(0 0 48px rgba(96,215,255,0.35));
      animation: imageHum 4.8s ease-in-out infinite, flicker 5.6s infinite;
    }

    .ripple-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .ripple {
      position: absolute;
      left: 50%;
      bottom: 8%;
      width: var(--size);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translateX(-50%) scale(0.2);
      border: 1px solid rgba(96,215,255,0.18);
      box-shadow:
        0 0 18px rgba(96,215,255,0.08),
        inset 0 0 12px rgba(0,255,136,0.04);
      opacity: 0;
      animation: rippleOut 8s linear infinite;
      animation-delay: var(--delay);
    }

    .text-panel {
      min-height: unset;
      padding: 26px 26px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(219,255,247,0.46);
      margin: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 66px);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-shadow:
        0 0 8px rgba(77,255,218,0.5),
        0 0 22px rgba(96,215,255,0.18);
    }

    

    .terminal {
      position: relative;
      flex: 1;
      min-height: 320px;
      margin-top: 6px;
      border: 1px solid rgba(140,255,228,0.14);
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 18%),
        linear-gradient(180deg, rgba(4,15,14,0.84), rgba(2,8,7,0.96));
      overflow: hidden;
      box-shadow:
        inset 0 0 22px rgba(96,215,255,0.04),
        0 0 22px rgba(0,255,136,0.05);
    }

    .terminal::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.018) 0px,
          rgba(255,255,255,0.018) 1px,
          transparent 2px,
          transparent 4px
        );
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .terminal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.06) 49%, rgba(96,215,255,0.03) 50%, transparent 100%);
      transform: translateY(-120%);
      animation: scanFlash 8.5s linear infinite;
      pointer-events: none;
      opacity: 0.55;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(140,255,228,0.1);
      background: rgba(255,255,255,0.02);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.26em;
      color: rgba(219,255,247,0.52);
    }

    .lights {
      display: inline-flex;
      gap: 8px;
    }

    .lights span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(219,255,247,0.25);
      box-shadow: 0 0 10px rgba(77,255,218,0.15);
    }

    .terminal-body {
      position: relative;
      height: 100%;
      min-height: 260px;
      padding: 18px 18px 20px;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(96,215,255,0.35) transparent;
    }

    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-thumb {
      background: rgba(96,215,255,0.28);
      border-radius: 999px;
    }

    .typed-text {
      margin: 0;
      white-space: pre-wrap;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(13px, 1.15vw, 15px);
      line-height: 1.72;
      color: rgba(214,255,247,0.92);
      text-shadow: 0 0 8px rgba(77,255,218,0.18);
    }

    .cursor {
      display: inline-block;
      width: 0.7ch;
      margin-left: 0.15ch;
      color: rgba(219,255,247,0.95);
      animation: blink 1s steps(1, end) infinite;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .ritual-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 178px;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(140,255,228,0.22);
      background: rgba(2, 8, 7, 0.44);
      color: rgba(219,255,247,0.86);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-size: 12px;
      transition: 0.25s ease;
      box-shadow: 0 0 18px rgba(0,255,136,0.08);
    }

    .ritual-button:hover {
      color: #fff;
      border-color: rgba(140,255,228,0.46);
      box-shadow: 0 0 24px rgba(0,255,136,0.14), 0 0 44px rgba(96,215,255,0.1);
      transform: translateY(-2px);
    }

    .status {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.26em;
      color: rgba(219,255,247,0.42);
    }

    .dust {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .dust i {
      position: absolute;
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.84), rgba(77,255,218,0.45) 45%, transparent 72%);
      left: var(--x);
      top: var(--y);
      opacity: 0.14;
      animation: drift var(--t) linear infinite;
      animation-delay: var(--d);
    }

    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.98); opacity: 0.74; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.97); opacity: 0.7; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    @keyframes imageHum {
      0%, 100% { transform: translateY(0) scale(0.992); }
      50% { transform: translateY(-4px) scale(1.006); }
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.98; }
      7% { opacity: 0.92; }
      8% { opacity: 1; }
      9% { opacity: 0.88; }
      10% { opacity: 1; }
      36% { opacity: 0.95; }
      37% { opacity: 0.86; }
      38% { opacity: 1; }
      62% { opacity: 0.96; }
      63% { opacity: 0.9; }
      64% { opacity: 1; }
    }

    @keyframes rippleOut {
      0% {
        transform: translateX(-50%) scale(0.24);
        opacity: 0;
      }
      10% { opacity: 0.34; }
      55% { opacity: 0.16; }
      100% {
        transform: translateX(-50%) scale(1.28);
        opacity: 0;
      }
    }

    @keyframes scanFlash {
      0% { transform: translateY(-120%); }
      100% { transform: translateY(120%); }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes drift {
      0% { transform: translate3d(0,0,0) scale(0.8); opacity: 0; }
      14% { opacity: 0.16; }
      50% { opacity: 0.24; }
      100% { transform: translate3d(var(--dx), var(--dy), 0) scale(1.2); opacity: 0; }
    }

    @media (max-width: 980px) {
      .hero {
        grid-template-columns: 1fr;
        max-width: 820px;
      }

      .ritual-image-panel,
      .text-panel {
        min-height: unset;
      }

      .ritual-image-panel {
        min-height: 420px;
        position: relative;
        top: auto;
      }
    }

    @media (max-width: 720px) {
      .page {
        padding: 88px 16px 100px;
      }

      .back-link { left: 16px; }
      .next-link { right: 16px; }

      .panel {
        border-radius: 22px;
      }

      .text-panel {
        padding: 22px 18px 18px;
      }

      .terminal-body {
        min-height: 220px;
        padding: 16px;
      }

      .controls {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="dust" aria-hidden="true"></div>

  <a class="nav-link back-link" href="story.html">Back</a>
  <a class="nav-link next-link" href="index.html">Home</a>

  <main class="page">
    <section class="hero">
      <article class="panel ritual-image-panel">
        <div class="ripple-layer" aria-hidden="true">
          <span class="ripple" style="--size: 180px; --delay: 0s;"></span>
          <span class="ripple" style="--size: 260px; --delay: 1.15s;"></span>
          <span class="ripple" style="--size: 340px; --delay: 2.3s;"></span>
          <span class="ripple" style="--size: 430px; --delay: 3.45s;"></span>
          <span class="ripple" style="--size: 520px; --delay: 4.6s;"></span>
          <span class="ripple" style="--size: 620px; --delay: 5.75s;"></span>
          <span class="ripple" style="--size: 760px; --delay: 6.9s;"></span>
        </div>

        <div class="ritual-art-wrap">
          <div class="ritual-aura"></div>
          <!-- Replace with your actual rectangular line-art file -->
          <img class="ritual-art" src="images/ritual.png" alt="Line art of kneeling figure casting the spell in water" />
        </div>
      </article>

      <article class="panel text-panel">
        <p class="eyebrow">spell transcript / active terminal</p>
        <h1>Ritual</h1>
        
        <section class="terminal" aria-label="Typing ritual text">
          <div class="terminal-header">
            <span>ritual.execute</span>
            <div class="lights" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
          <div class="terminal-body" id="terminalBody">
            <pre class="typed-text" id="typedText"></pre><span class="cursor" aria-hidden="true">▌</span>
          </div>
        </section>

        <div class="controls">
          <a class="ritual-button" href="#" id="replayButton">Replay Text</a>
          <div class="status">wave count locked / coin committed / channel open</div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const dust = document.querySelector('.dust');
    for (let i = 0; i < 42; i++) {
      const p = document.createElement('i');
      const s = (Math.random() * 4 + 1).toFixed(2) + 'px';
      const x = (Math.random() * 100).toFixed(2) + '%';
      const y = (Math.random() * 100).toFixed(2) + '%';
      const t = (Math.random() * 14 + 10).toFixed(2) + 's';
      const d = (-Math.random() * 14).toFixed(2) + 's';
      const dx = (Math.random() * 100 - 50).toFixed(2) + 'px';
      const dy = (Math.random() * 120 - 60).toFixed(2) + 'px';
      p.style.setProperty('--s', s);
      p.style.setProperty('--x', x);
      p.style.setProperty('--y', y);
      p.style.setProperty('--t', t);
      p.style.setProperty('--d', d);
      p.style.setProperty('--dx', dx);
      p.style.setProperty('--dy', dy);
      dust.appendChild(p);
    }

    const ritualText = `> INITIATE EMERALD FEVER / ROUND TWO

[ SPELL TRANSCRIPT ]
EMERALD FEVER SPELL - AZZURRO

The tide is not your throat to choke,
The reef, not yours to stain with greed.
Let poisoned light in silence soak-
And bloom where salt and sorrow breed.

The flow is not your waste to pour,
Nor sea your sink for rot and run,
Let emerald fever flood the shore,
Til sunlit waters drown in sun.

The beach remembers what you’ve done
The jetty keeps the name you burned,
Let green arise where I was shunned-
And thick as guilt the waters turn!

The water is not yours to claim,
Nor currents yours to twist and bind,
Let bloom ascend in vengeful blame,
A mirror to the artists mind!

The soil is not your spade's to turn,
The sand is not your hand's to sift,
A curse on he who moves the earth.
As heavy as the earth to lift!!

[ STATUS ]
Wave count acknowledged: VII
Coin committed to surf.
Signal accepted by water.
Bloom channel opening...
`; 

    const typedText = document.getElementById('typedText');
    const terminalBody = document.getElementById('terminalBody');
    const replayButton = document.getElementById('replayButton');

    let typeIndex = 0;
    let typingTimer;

    function typeRitual() {
      clearTimeout(typingTimer);
      typedText.textContent = '';
      typeIndex = 0;

      function tick() {
        if (typeIndex < ritualText.length) {
          typedText.textContent += ritualText.charAt(typeIndex);
          typeIndex += 1;
          terminalBody.scrollTop = terminalBody.scrollHeight;

          const char = ritualText.charAt(typeIndex - 1);
          let delay = 22;
          if (char === '\n') delay = 80;
          if (char === '.' || char === ',' || char === ';' || char === ':') delay = 52;
          if (char === ']') delay = 90;
          typingTimer = setTimeout(tick, delay);
        }
      }

      tick();
    }

    replayButton.addEventListener('click', (event) => {
      event.preventDefault();
      typeRitual();
    });

    typeRitual();
  </script>
</body>
</html>
