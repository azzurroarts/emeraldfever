<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emerald Fever — Story Mode</title>
  <style>
    :root {
      --bg-1: #020706;
      --bg-2: #041110;
      --bg-3: #0a1d1c;
      --neon-a: #4dffda;
      --neon-b: #00ff88;
      --neon-c: #60d7ff;
      --text: #d9fff4;
      --muted: rgba(217, 255, 244, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 50%, rgba(0,255,136,0.07), transparent 18%),
        radial-gradient(circle at 50% 60%, rgba(96,215,255,0.06), transparent 26%),
        linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 40%, var(--bg-1) 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        conic-gradient(
          from 0deg,
          transparent 0deg 18deg,
          rgba(96,215,255,0.03) 18deg 22deg,
          transparent 22deg 44deg,
          rgba(0,255,136,0.03) 44deg 48deg,
          transparent 48deg 360deg
        );
      filter: blur(50px);
      animation: slowSpin 30s linear infinite;
      pointer-events: none;
      opacity: 0.7;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 0 45%, rgba(0,0,0,0.35) 80%, rgba(0,0,0,0.72) 100%),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.02) 0px,
          rgba(255,255,255,0.02) 1px,
          transparent 2px,
          transparent 4px
        );
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .page {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      isolation: isolate;
    }

    .content {
      position: relative;
      z-index: 5;
      text-align: center;
      max-width: 780px;
      padding: 40px 30px;
      border: 1px solid rgba(140,255,228,0.14);
      background: linear-gradient(180deg, rgba(7,19,18,0.42), rgba(2,8,7,0.68));
      backdrop-filter: blur(8px);
      box-shadow:
        inset 0 0 30px rgba(96,215,255,0.04),
        0 0 30px rgba(0,255,136,0.08),
        0 0 80px rgba(96,215,255,0.06);
      border-radius: 22px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(217,255,244,0.45);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(34px, 6vw, 72px);
      line-height: 0.95;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow:
        0 0 10px rgba(77,255,218,0.28),
        0 0 24px rgba(96,215,255,0.12);
    }

    .lead {
      margin: 0 auto;
      max-width: 620px;
      font-size: clamp(16px, 1.8vw, 21px);
      line-height: 1.7;
      color: var(--muted);
      text-wrap: balance;
    }

    .glitch-word {
      position: relative;
      display: inline-block;
      color: #eafff8;
      text-shadow:
        0 0 8px rgba(77,255,218,0.55),
        0 0 20px rgba(96,215,255,0.18);
      animation: textFlicker 5s infinite;
    }

    .glitch-word::before,
    .glitch-word::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }

    .glitch-word::before {
      color: rgba(0,255,136,0.85);
      transform: translate(-2px, 0);
      animation: glitchA 4.5s infinite;
    }

    .glitch-word::after {
      color: rgba(96,215,255,0.85);
      transform: translate(2px, 0);
      animation: glitchB 3.8s infinite;
    }

    .floating-graphics {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .graphic {
      position: absolute;
      opacity: 0;
      mix-blend-mode: screen;
      animation: flickerInOut var(--dur) steps(2, end) infinite;
      animation-delay: var(--delay);
      filter:
        drop-shadow(0 0 6px rgba(255,255,255,0.15))
        drop-shadow(0 0 14px rgba(77,255,218,0.18))
        drop-shadow(0 0 28px rgba(96,215,255,0.08));
    }

    .graphic img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0.92;
    }

    .graphic::before,
    .graphic::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--img);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0;
      pointer-events: none;
    }

    .graphic::before {
      transform: translate(-4px, 0);
      filter: hue-rotate(-25deg) saturate(1.3);
      mix-blend-mode: screen;
      animation: ghostShiftA var(--dur) steps(2, end) infinite;
      animation-delay: var(--delay);
    }

    .graphic::after {
      transform: translate(4px, 0);
      filter: hue-rotate(35deg) saturate(1.4);
      mix-blend-mode: screen;
      animation: ghostShiftB calc(var(--dur) * 0.92) steps(2, end) infinite;
      animation-delay: var(--delay);
    }

    .g1 {
      width: min(24vw, 260px);
      left: 8%;
      top: 14%;
    }

    .g2 {
      width: min(20vw, 210px);
      right: 10%;
      top: 18%;
    }

    .g3 {
      width: min(22vw, 240px);
      left: 12%;
      bottom: 14%;
    }

    .g4 {
      width: min(18vw, 180px);
      right: 14%;
      bottom: 18%;
    }

    .g5 {
      width: min(26vw, 260px);
      left: 50%;
      top: 6%;
      transform: translateX(-50%);
    }

    .g6 {
      width: min(22vw, 240px);
      left: 22%;
      top: 48%;
    }

    .g7 {
      width: min(22vw, 240px);
      right: 18%;
      top: 52%;
    }

    .scanline-flash {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(96,215,255,0.04) 48%,
        rgba(255,255,255,0.12) 50%,
        rgba(0,255,136,0.04) 52%,
        transparent 100%
      );
      transform: translateY(-120%);
      animation: scanFlash 8s linear infinite;
      pointer-events: none;
      z-index: 4;
      opacity: 0.5;
    }

    .back-link {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 8;
      color: rgba(217,255,244,0.72);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(140,255,228,0.18);
      background: rgba(2,8,7,0.35);
      backdrop-filter: blur(6px);
      transition: 0.25s ease;
    }

    .back-link:hover {
      color: #fff;
      border-color: rgba(140,255,228,0.4);
      box-shadow: 0 0 20px rgba(96,215,255,0.08);
    }

    .dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .dust i {
      position: absolute;
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.85), rgba(77,255,218,0.4) 45%, transparent 72%);
      left: var(--x);
      top: var(--y);
      opacity: 0.14;
      animation: drift var(--t) linear infinite;
      animation-delay: var(--d);
    }

    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes drift {
      0% {
        transform: translate3d(0, 0, 0) scale(0.8);
        opacity: 0;
      }
      15% { opacity: 0.18; }
      50% { opacity: 0.24; }
      100% {
        transform: translate3d(var(--dx), var(--dy), 0) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes flickerInOut {
      0%, 100% { opacity: 0; }
      6% { opacity: 0; }
      8% { opacity: 0.9; }
      11% { opacity: 0.22; }
      14% { opacity: 0.78; }
      19% { opacity: 0.08; }
      23% { opacity: 0.66; }
      32% { opacity: 0.12; }
      37% { opacity: 0.82; }
      48% { opacity: 0.18; }
      55% { opacity: 0.74; }
      63% { opacity: 0.1; }
      68% { opacity: 0.86; }
      82% { opacity: 0.18; }
      90% { opacity: 0.72; }
    }

    @keyframes ghostShiftA {
      0%, 100% { opacity: 0; }
      8% { opacity: 0.32; }
      9% { opacity: 0; }
      23% { opacity: 0.22; }
      24% { opacity: 0; }
      56% { opacity: 0.26; }
      57% { opacity: 0; }
      70% { opacity: 0.22; }
      71% { opacity: 0; }
    }

    @keyframes ghostShiftB {
      0%, 100% { opacity: 0; }
      10% { opacity: 0.28; }
      11% { opacity: 0; }
      31% { opacity: 0.18; }
      32% { opacity: 0; }
      61% { opacity: 0.26; }
      62% { opacity: 0; }
      87% { opacity: 0.2; }
      88% { opacity: 0; }
    }

    @keyframes glitchA {
      0%, 100% { opacity: 0; }
      2% { opacity: 0.9; }
      4% { opacity: 0; }
      36% { opacity: 0; }
      38% { opacity: 0.65; }
      40% { opacity: 0; }
      78% { opacity: 0; }
      80% { opacity: 0.7; }
      82% { opacity: 0; }
    }

    @keyframes glitchB {
      0%, 100% { opacity: 0; }
      8% { opacity: 0.75; }
      10% { opacity: 0; }
      52% { opacity: 0; }
      54% { opacity: 0.6; }
      56% { opacity: 0; }
      88% { opacity: 0; }
      90% { opacity: 0.8; }
      92% { opacity: 0; }
    }

    @keyframes textFlicker {
      0%, 100% { opacity: 1; }
      7% { opacity: 0.94; }
      8% { opacity: 1; }
      9% { opacity: 0.9; }
      10% { opacity: 1; }
      59% { opacity: 1; }
      60% { opacity: 0.88; }
      61% { opacity: 1; }
    }

    @keyframes scanFlash {
      0% { transform: translateY(-120%); }
      100% { transform: translateY(120%); }
    }

    @media (max-width: 900px) {
      .g1, .g2, .g3, .g4, .g5, .g6, .g7 {
        width: min(30vw, 220px);
      }

      .content {
        padding: 32px 22px;
      }
    }

    @media (max-width: 700px) {
      .graphic {
        opacity: 0.38 !important;
      }

      .g1 {
        width: 34vw;
        left: 2%;
        top: 10%;
      }

      .g2 {
        width: 30vw;
        right: 3%;
        top: 12%;
      }

      .g3 {
        width: 32vw;
        left: 4%;
        bottom: 12%;
      }

      .g4 {
        width: 28vw;
        right: 6%;
        bottom: 14%;
      }

      .g5 {
        width: 36vw;
        top: 7%;
      }

      .g6 {
        width: 30vw;
        left: 4%;
        top: 52%;
      }

      .g7 {
        width: 30vw;
        right: 4%;
        top: 56%;
      }

      .back-link {
        top: 16px;
        left: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="index.html">Back</a>

    <div class="dust" aria-hidden="true"></div>

    <div class="floating-graphics" aria-hidden="true">
      <div class="graphic g1" style="--dur: 7.2s; --delay: -0.8s;">
        <img src="images/biohazard.png" alt="">
      </div>

      <div class="graphic g2" style="--dur: 6.4s; --delay: -2.1s;">
        <img src="images/sub2.png" alt="">
      </div>

      <div class="graphic g3" style="--dur: 8.1s; --delay: -3.4s;">
        <img src="images/chinese.png" alt="">
      </div>

      <div class="graphic g4" style="--dur: 5.8s; --delay: -1.7s;">
        <img src="images/sub2.png" alt="">
      </div>

      <div class="graphic g5" style="--dur: 6.8s; --delay: -2.4s;">
        <img src="images/algaebits.png" alt="">
      </div>

      <div class="graphic g6" style="--dur: 7.4s; --delay: -3.2s;">
        <img src="images/rocket.png" alt="">
      </div>

      <div class="graphic g7" style="--dur: 6.1s; --delay: -1.5s;">
        <img src="images/sub1.png" alt="">
      </div>
    </div>

    <div class="scanline-flash" aria-hidden="true"></div>

    <section class="content">
      <div class="eyebrow">field transmission / archive breach</div>
      <h1><span class="glitch-word" data-text="Emerald Fever">Emerald Fever</span></h1>
      <p class="lead">
        The bloom was never merely weather. It spread like a thought, a stain, a summons.
        What surfaced first was colour. What followed was silence.
      </p>
    </section>
  </main>

  <script>
    const dust = document.querySelector('.dust');

    for (let i = 0; i < 36; i++) {
      const p = document.createElement('i');
      const s = (Math.random() * 4 + 1).toFixed(2) + 'px';
      const x = (Math.random() * 100).toFixed(2) + '%';
      const y = (Math.random() * 100).toFixed(2) + '%';
      const t = (Math.random() * 14 + 10).toFixed(2) + 's';
      const d = (-Math.random() * 14).toFixed(2) + 's';
      const dx = (Math.random() * 100 - 50).toFixed(2) + 'px';
      const dy = (Math.random() * 120 - 60).toFixed(2) + 'px';

      p.style.setProperty('--s', s);
      p.style.setProperty('--x', x);
      p.style.setProperty('--y', y);
      p.style.setProperty('--t', t);
      p.style.setProperty('--d', d);
      p.style.setProperty('--dx', dx);
      p.style.setProperty('--dy', dy);

      dust.appendChild(p);
    }

    document.querySelectorAll('.graphic').forEach(graphic => {
      const img = graphic.querySelector('img');
      const src = img.getAttribute('src');
      graphic.style.setProperty('--img', `url("${src}")`);
    });
  </script>
</body>
</html>
